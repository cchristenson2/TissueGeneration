[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tissue-generation"
version = "0.1.0"
description = "Generate annotated 2D virtual tissues from spatial samples or summaries"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "pandas>=1.5", "PyYAML>=6"]

[project.optional-dependencies]
spatial = ["anndata>=0.9"]
notebook = ["rdata>=1.1", "matplotlib>=3.7", "ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]
